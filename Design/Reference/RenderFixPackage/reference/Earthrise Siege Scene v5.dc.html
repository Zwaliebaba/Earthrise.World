<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

</helmet>
<div style="position:relative;width:100vw;height:100vh;background:#1b1916;overflow:hidden">

  <div style="position:absolute;right:56px;top:48px;max-width:400px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#e8b86a;white-space:pre-wrap">{{ err }}</div>

    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#a69c8a">Generating land…</div>
  </sc-if>
  <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;pointer-events:none">
      <div ref="{{ l1 }}" style="position:absolute;left:0;top:0;width:0;height:0;opacity:0">
        
      </div>
      <div ref="{{ l2 }}" style="position:absolute;left:0;top:0;width:0;height:0;opacity:0">
        
      </div>
      <div ref="{{ l3 }}" style="position:absolute;left:0;top:0;width:0;height:0;opacity:0">
        <div style="position:absolute;left:-20px;bottom:-5px;display:flex;flex-direction:column;align-items:center">
          
          
          
        </div>
      </div>
      <div ref="{{ l4 }}" style="position:absolute;left:0;top:0;width:0;height:0;opacity:0">
        
      </div>
    </div>
    
  </sc-if>
  
  
  <div style="position:absolute;right:56px;bottom:48px;display:flex;gap:6px;align-items:center;background:rgba(21,19,16,.9);padding:6px">
    <button onClick="{{ rotL }}" style="width:56px;height:56px;border:0;background:#2a2621;color:#f3ede2;font-size:26px;cursor:pointer" style-hover="background:#3a342c">↺</button>

  </div>
</div>
</div>
</x-dc>
